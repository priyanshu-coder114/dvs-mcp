[project]
name = "dvs-mcp"
version = "0.1.0"
description = "MCP server that calls Namekart Domain Valuation Service APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dvs-mcp = "dvs_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
